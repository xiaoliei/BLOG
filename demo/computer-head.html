<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMPUTER_HEAD // GLB VIEWER — BLOG_OS</title>
  <meta name="description" content="computer_head.glb 头颅模型查看器：轨道旋转 / 缩放 / 自动环绕 / 线框">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/"
      }
    }
  </script>
  <style>
    body.head-viewer-page {
      background: radial-gradient(circle at 50% 32%, #101d36 0%, #0a1424 45%, #030712 100%);
    }

    .viewer-stage {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    #viewer3d {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
    }

    /* 左侧模型信息面板 */
    .head-panel {
      position: fixed;
      top: 64px;
      left: 18px;
      z-index: 40;
      width: 292px;
      padding: 0 0 14px;
    }

    .head-title {
      font-family: var(--font-pixel);
      font-size: 11px;
      color: var(--accent);
      line-height: 1.8;
      padding: 12px 16px 4px;
      letter-spacing: 0.5px;
    }

    .head-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 4px 16px 8px;
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 1px;
    }

    .head-meta #head-source { color: var(--text-bright); font-weight: 600; }
    .head-meta #head-state { color: var(--cyan); }
    .head-meta #head-state.done { color: var(--ok); }
    .head-meta #head-state.error { color: var(--danger); }

    .head-stats {
      padding: 0 16px;
      color: var(--dim);
      font-size: 10px;
      letter-spacing: 1px;
      line-height: 1.9;
    }

    .head-stats .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .head-stats .row b {
      color: var(--text);
      font-weight: 500;
    }

    .head-stats .row .v {
      color: var(--cyan);
      font-family: var(--font-mono);
    }

    .head-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 12px 16px 0;
    }

    .head-btn {
      padding: 8px 0;
      background: transparent;
      color: var(--cyan);
      border: 1px solid rgba(26, 188, 156, 0.45);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.18s, color 0.18s, border-color 0.18s;
      white-space: nowrap;
    }

    .head-btn:hover {
      background: var(--cyan-soft);
      border-color: var(--cyan);
      color: var(--text-bright);
    }

    .head-btn.on {
      background: var(--cyan-soft);
      border-color: var(--cyan);
      color: var(--text-bright);
    }

    .head-btn--accent {
      color: var(--accent);
      border-color: rgba(230, 126, 34, 0.45);
    }

    .head-btn--accent:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--text-bright);
    }

    .head-btn--accent.on {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--text-bright);
    }

    /* 底部操作提示 */
    .viewer-hint {
      position: fixed;
      bottom: calc(var(--status-h) + 14px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      color: var(--dim);
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
    }

    .viewer-hint b { color: var(--cyan); font-weight: 500; }

    .hud-br {
      bottom: calc(var(--status-h) + 12px);
      right: 16px;
      text-align: right;
    }

    @media (max-width: 720px) {
      .head-panel { width: 232px; left: 10px; top: 56px; }
      .head-title { font-size: 9px; padding: 10px 12px 4px; }
      .head-meta, .head-stats { padding-left: 12px; padding-right: 12px; }
      .head-btns { padding-left: 12px; padding-right: 12px; }
      .viewer-hint { font-size: 9px; letter-spacing: 1px; }
    }
  </style>
</head>
<body class="head-viewer-page">
  <div class="grid-bg"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <div class="hud-corner hud-tl">BLOG_OS // <b>v2.0.4</b></div>
  <div class="hud-corner hud-tr">SESSION <i>0x8F2A</i> &nbsp;|&nbsp; MODE: HEAD_VIEW</div>
  <div class="hud-corner hud-br" id="hud-status">COMPUTER_HEAD <i>STANDBY</i></div>

  <main class="viewer-stage">
    <canvas id="viewer3d"></canvas>

    <section class="panel head-panel">
      <div class="panel-head">
        <span>◈ HEAD_VIEWER // 头颅模型</span>
        <span class="led"></span>
      </div>
      <div class="head-title">COMPUTER_HEAD</div>
      <div class="head-meta">
        <span id="head-source">computer_head.glb</span>
        <span id="head-state">LOADING…</span>
      </div>
      <div class="head-stats" id="head-stats">
        <div class="row"><b>VERTS</b><span class="v" id="stat-verts">--</span></div>
        <div class="row"><b>TRIS</b><span class="v" id="stat-tris">--</span></div>
        <div class="row"><b>TEXTURE</b><span class="v">PNG · EMBEDDED</span></div>
        <div class="row"><b>LAYERS</b><span class="v">BASE + HAT</span></div>
      </div>
      <div class="head-btns">
        <button class="head-btn on" id="btn-rotate">↻ AUTO_ROTATE</button>
        <button class="head-btn head-btn--accent" id="btn-wire">▤ WIREFRAME</button>
      </div>
    </section>
  </main>

  <div class="viewer-hint">DRAG <b>旋转</b> // WHEEL <b>缩放</b> // RIGHT-DRAG <b>平移</b></div>

  <div class="status-bar">
    <span class="sb-item"><span class="lb">SYS</span><span class="vl">BLOG_OS</span></span>
    <span class="sb-item sb-up"><span class="lb">TASK</span><span class="vl" data-uptime>UP 00:00:00</span></span>
    <span class="sb-coords sb-item" data-coords></span>
    <span class="sb-item"><span class="lb">NET</span><span data-net class="net-state online">ONLINE</span></span>
    <span class="sb-item"><span class="lb">TX</span><span class="vl" data-upspeed>0.00 MB/s</span></span>
    <span class="sb-item"><span class="lb">UTC+8</span><span class="vl" data-clock>--:--</span></span>
  </div>

  <div id="toast"></div>

  <script type="module" src="js/computer-head.js"></script>
</body>
</html>
