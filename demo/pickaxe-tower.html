<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAYER_LOAD // STONE_PICKAXE_TOWER — BLOG_OS</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/"
      }
    }
  </script>
  <style>
    body.pickaxe-page {
      background: radial-gradient(circle at 50% 30%, #101d36 0%, #0a1424 45%, #030712 100%);
    }

    .viewer-stage {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    #viewer3d {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
    }

    /* 层级加载面板 */
    .layer-panel {
      position: fixed;
      top: 64px;
      left: 18px;
      z-index: 40;
      width: 292px;
      padding: 0 0 14px;
    }

    .layer-title {
      font-family: var(--font-pixel);
      font-size: 11px;
      color: var(--accent);
      line-height: 1.8;
      padding: 12px 16px 4px;
      letter-spacing: 0.5px;
    }

    .layer-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 4px 16px 8px;
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 1px;
    }

    .layer-meta #layer-count { color: var(--text-bright); font-weight: 600; }
    .layer-meta #layer-state { color: var(--cyan); }
    .layer-meta #layer-state.done { color: var(--ok); }
    .layer-meta #layer-state.error { color: var(--danger); }

    .layer-bar {
      margin: 0 16px 10px;
      height: 5px;
      background: rgba(102, 138, 178, 0.16);
      border: 1px solid rgba(102, 138, 178, 0.28);
      position: relative;
      overflow: hidden;
    }

    .layer-bar #layer-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      background: linear-gradient(90deg, #0e7c68, #1abc9c, #e67e22);
      box-shadow: 0 0 8px rgba(26, 188, 156, 0.65);
      transition: width 0.12s linear;
    }

    .layer-stats {
      padding: 0 16px;
      color: var(--dim);
      font-size: 10px;
      letter-spacing: 1px;
      min-height: 16px;
    }

    .btn-replay {
      display: block;
      margin: 12px 16px 0;
      width: calc(100% - 32px);
      padding: 8px 0;
      background: transparent;
      color: var(--cyan);
      border: 1px solid rgba(26, 188, 156, 0.45);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 2px;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.18s, color 0.18s, border-color 0.18s;
    }

    .btn-replay:hover:not(:disabled) {
      background: var(--cyan-soft);
      border-color: var(--cyan);
      color: var(--text-bright);
    }

    .btn-replay:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* 底部操作提示 */
    .viewer-hint {
      position: fixed;
      bottom: calc(var(--status-h) + 14px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      color: var(--dim);
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
    }

    .viewer-hint b { color: var(--cyan); font-weight: 500; }

    /* 右侧状态徽标 */
    .hud-br {
      bottom: calc(var(--status-h) + var(--nav-h) + 12px);
      right: 16px;
      text-align: right;
    }
  </style>
</head>
<body class="pickaxe-page">
  <div class="grid-bg"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <div class="hud-corner hud-tl">BLOG_OS // <b>v2.0.4</b></div>
  <div class="hud-corner hud-tr">SESSION <i>0x8F2A</i> &nbsp;|&nbsp; MODE: LAYER_LOAD</div>
  <div class="hud-corner hud-br" id="hud-status">LAYERED_LOAD <i>STANDBY</i></div>

  <main class="viewer-stage">
    <canvas id="viewer3d"></canvas>

    <section class="panel layer-panel">
      <div class="panel-head">
        <span>◈ LAYERED_LOAD // 层级加载</span>
        <span class="led"></span>
      </div>
      <div class="layer-title">STONE_PICKAXE_TOWER</div>
      <div class="layer-meta">
        <span id="layer-count">-- / --</span>
        <span id="layer-state">STANDBY</span>
      </div>
      <div class="layer-bar"><div id="layer-fill"></div></div>
      <div class="layer-stats" id="layer-stats">LOADING MODEL…</div>
      <button class="btn-replay" id="btn-replay" disabled>↻ REPLAY 重新加载</button>
    </section>
  </main>

  <div class="viewer-hint">DRAG <b>旋转视角</b> // WHEEL <b>缩放</b> // AUTO_ROTATE 自动环绕</div>

  <div class="status-bar">
    <span class="sb-item"><span class="lb">SYS</span><span class="vl">BLOG_OS</span></span>
    <span class="sb-item sb-up"><span class="lb">TASK</span><span class="vl" data-uptime>UP 00:00:00</span></span>
    <span class="sb-coords sb-item" data-coords></span>
    <span class="sb-item"><span class="lb">NET</span><span data-net class="net-state online">ONLINE</span></span>
    <span class="sb-item"><span class="lb">TX</span><span class="vl" data-upspeed>0.00 MB/s</span></span>
    <span class="sb-item"><span class="lb">UTC+8</span><span class="vl" data-clock>--:--</span></span>
  </div>

  <div id="toast"></div>

  <script type="module" src="js/pickaxe-tower.js"></script>
</body>
</html>
